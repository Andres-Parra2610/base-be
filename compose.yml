services:
  backend:
    build:
      context: .
      args:
        - PORT=${PORT}
    ports:
      - ${PORT}:${PORT}
    env_file:
      - .env
    container_name: livestock-backend
    environment:
      - PORT=${PORT}
      - NODE_ENV=development
      - DATABASE_HOST=livestock-db
      - DATABASE_PORT=5432
      - DATABASE_USER=postgres
      - DATABASE_PASSWORD=postgres
      - DATABASE_NAME=livestock
      - JWT_SECRET=secret
      - JWT_REFRESH_TOKEN=refresh_token
      - LOGGER_LEVEL=${LOGGER_LEVEL}
